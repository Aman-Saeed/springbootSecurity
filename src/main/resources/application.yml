spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          facebook:
            client-id: facebook-client-id
            client-secret: facebook-client-secret
          github:
            client-id: github-client-id
            client-secret: github-client-secret